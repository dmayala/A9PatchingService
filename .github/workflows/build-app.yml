name: Build a9service.apk

# Builds the accessibility-service APK and signs it with OUR OWN key
# (CN=Daniel), held in the repo secrets A9_SIGNING_KEY_PK8 /
# A9_SIGNING_CERT_PEM. The public certificate is committed as
# keys/daniel.x509.pem so builds can be verified:
#   apksigner verify --print-certs a9service.apk
#   -> SHA-256: c2ee5e84899e1a4b84db7d61aa7e4f47bccd403e9bff0848487a09e504f63d97
#
# Why not the AOSP platform test key: this app declares NO sharedUserId, so it
# does not need to be platform-signed -- it only needs to live in priv-app to
# get privileged permissions. Upstream signs it CN=Damian for the same reason.
#
# CONSEQUENCE OF FORKING: our key differs from upstream CN=Damian
# (399f43ba3257c4aa...), so this APK CANNOT be installed as an update over a
# Damian-signed build -- adb install fails with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE, and dropping it into /system/priv-app on
# a device whose /data still records the old signature makes PackageManager
# reject it. Ship it in the image AND wipe /data, or change applicationId.

on:
  workflow_dispatch:
    inputs:
      buildtype:
        description: 'Build type (debug or release)'
        default: 'debug'
        required: true
  push:
    branches: [ a16-port ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'app/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: |
          if [ "${{ github.event.inputs.buildtype }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Restore signing key
        env:
          PK8: ${{ secrets.A9_SIGNING_KEY_PK8 }}
          PEM: ${{ secrets.A9_SIGNING_CERT_PEM }}
        run: |
          if [ -z "$PK8" ] || [ -z "$PEM" ]; then
            echo "::error::A9_SIGNING_KEY_PK8 / A9_SIGNING_CERT_PEM secrets are not set"
            exit 1
          fi
          printf '%s' "$PK8" | base64 -d > signing.pk8
          printf '%s' "$PEM" | base64 -d > signing.x509.pem

      - name: Zipalign and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "build-tools: $BT"
          echo "apk: $APK"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --key signing.pk8 --cert signing.x509.pem \
            --out a9service.apk aligned.apk
          "$BT/apksigner" verify --print-certs a9service.apk
          rm -f signing.pk8 signing.x509.pem

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a9service
          path: a9service.apk
          if-no-files-found: error
